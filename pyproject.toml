[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-rnd-audit"
version = "0.1.0"
description = "Deterministic Data Audit & Governance Suite for Kestrel R&D Formulation Assistant"
authors = [{ name = "Senior Python Engineer / Head of Engineering Candidate" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
