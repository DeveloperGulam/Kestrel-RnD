<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="100%" height="340" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Participant Headers -->
  <!-- Chemist -->
  <rect x="15" y="10" width="100" height="30" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="65" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Chemist</text>
  <line x1="65" y1="40" x2="65" y2="325" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- API -->
  <rect x="145" y="10" width="110" height="30" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="200" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">FastAPI Orchestrator</text>
  <line x1="200" y1="40" x2="200" y2="325" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- LLM -->
  <rect x="285" y="10" width="110" height="30" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Inference Gateway</text>
  <line x1="340" y1="40" x2="340" y2="325" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- DB -->
  <rect x="425" y="10" width="105" height="30" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="477" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Store (SQL/BM25)</text>
  <line x1="477" y1="40" x2="477" y2="325" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Rule Engine -->
  <rect x="560" y="10" width="105" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="612" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Safety Barrier</text>
  <line x1="612" y1="40" x2="612" y2="325" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Audit -->
  <rect x="685" y="10" width="85" height="30" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="727" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Audit Log</text>
  <line x1="727" y1="40" x2="727" y2="325" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Step 1: Submit Brief -->
  <line x1="65" y1="60" x2="195" y2="60" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="130" y="55" text-anchor="middle" font-size="9" fill="#1e293b">1. Submit brief</text>

  <!-- Step 2: Parse Brief -->
  <line x1="200" y1="78" x2="335" y2="78" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="267" y="73" text-anchor="middle" font-size="9" fill="#1e293b">2. Parse brief to TargetSpecification</text>

  <!-- Step 3: Structured Target -->
  <line x1="340" y1="96" x2="205" y2="96" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="272" y="91" text-anchor="middle" font-size="9" fill="#475569">3. Structured Target JSON</text>

  <!-- Step 4: Bidirectional Query -->
  <line x1="200" y1="114" x2="472" y2="114" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="336" y="109" text-anchor="middle" font-size="9" fill="#1e293b">4. Bidirectional query (trials, prices, notes)</text>

  <!-- Step 5: Verified Trials + Failures -->
  <line x1="477" y1="132" x2="205" y2="132" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="341" y="127" text-anchor="middle" font-size="9" fill="#475569">5. Benchmarks + failure bounds (T-05, T-04 flags)</text>

  <!-- Step 6: Draft Candidates -->
  <line x1="200" y1="150" x2="335" y2="150" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="267" y="145" text-anchor="middle" font-size="9" fill="#1e293b">6. Draft candidates on evidence</text>

  <!-- Step 7: Candidates Output -->
  <line x1="340" y1="168" x2="205" y2="168" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="272" y="163" text-anchor="middle" font-size="9" fill="#475569">7. CandidateFormulations JSON</text>

  <!-- Safety Barrier Box -->
  <rect x="180" y="182" width="455" height="52" rx="4" fill="#eff6ff" fill-opacity="0.7" stroke="#93c5fd" stroke-width="1"/>
  <text x="190" y="195" font-size="8.5" font-weight="600" fill="#1d4ed8">Deterministic Safety Barrier (Python Decimal Engine)</text>
  
  <!-- Step 8: Validate -->
  <line x1="200" y1="208" x2="607" y2="208" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <text x="406" y="204" text-anchor="middle" font-size="8.5" fill="#1e40af">8a. Validate mass balance (100.0% &plusmn; 0.05%), units (cP, drum), active costs, silicone ban</text>
  
  <!-- Step 8b: Return Verified / Bounded Retry -->
  <line x1="612" y1="224" x2="205" y2="224" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow-blue)"/>
  <text x="408" y="220" text-anchor="middle" font-size="8.5" fill="#1e40af">8b. Verified candidates + auditable costs (or re-prompt diagnostic; max 2 retries)</text>

  <!-- Step 9: Audit Log -->
  <line x1="200" y1="248" x2="722" y2="248" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="461" y="244" text-anchor="middle" font-size="9" fill="#475569">9. Write tamper-evident log (Evidence IDs, SHA-256 Hash)</text>

  <!-- Step 10: Present to Chemist -->
  <line x1="200" y1="266" x2="70" y2="266" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="135" y="262" text-anchor="middle" font-size="9" fill="#1e293b">10. Present candidates &amp; cost schedule</text>

  <!-- Approval Gate Box -->
  <rect x="50" y="278" width="685" height="44" rx="4" fill="#fffbeb" fill-opacity="0.7" stroke="#fde68a" stroke-width="1"/>
  <text x="60" y="291" font-size="8.5" font-weight="600" fill="#b45309">Mandatory Chemist Sign-Off Gate (Zero Automated Lab Booking)</text>

  <!-- Step 11: Review & Sign-off -->
  <line x1="65" y1="304" x2="195" y2="304" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <text x="130" y="300" text-anchor="middle" font-size="8.5" fill="#92400e">11. Adjust &amp; sign-off</text>

  <!-- Step 12: Record Signature -->
  <line x1="200" y1="304" x2="722" y2="304" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <text x="461" y="300" text-anchor="middle" font-size="8.5" fill="#92400e">12. Record digital signature token</text>

  <!-- Step 13: Emit Plan -->
  <line x1="200" y1="316" x2="70" y2="316" stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="135" y="313" text-anchor="middle" font-size="8.5" fill="#065f46">13. Emit Approved Trial Plan</text>
</svg>